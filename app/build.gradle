plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hwj.recharge'
    compileSdk 36

    defaultConfig {
        applicationId "com.hwj.recharge"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
